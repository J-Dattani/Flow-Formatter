<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Document Merger</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <!-- Left Column: Login Form -->
        <div class="login-form-section">
            <div class="login-form-wrapper">
                <!-- Logo/Branding -->
                <div class="login-header">
                    <div class="logo-placeholder" style="cursor: pointer;" onclick="window.location.href='../form.html'" title="Back to forms">
                                           <img src="../assets/logo.png" width="50" height="50" alt="FormatFlow Logo" class="brand-logo">
                    </div>
                    <h1>Welcome Back</h1>
                    <p>Smart Document Merger Portal</p>
                </div>

                <!-- Login Form -->
                <form class="login-form" id="loginForm">
                    <!-- Success/Error Messages -->
                    <div id="login-success" class="auth-message success-message" style="display: none;"></div>
                    <div id="errorMessage" class="auth-message error-message" style="display: none;"></div>
                    <div class="auth-message info-message" style="display: none;"></div>
                    
                    <!-- Email Input -->
                    <div class="form-group">
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" class="form-input" id="email" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="form-group">
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" class="form-input" id="password" placeholder="Enter your password" required>
                            <button type="button" class="password-toggle" onclick="togglePassword()">
                                <i class="fas fa-eye" id="passwordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="form-group">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Keep me signed in
                        </label>
                    </div>

                    <!-- Sign In Button -->
                    <button type="submit" class="btn-primary-login">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </button>

                    <!-- Divider -->
                    <div class="divider">
                        <span>OR</span>
                    </div>

                    <!-- Social Login Buttons -->
                    <div class="social-buttons">
                        <button type="button" class="btn-social" onclick="loginWithGoogle()">
                            <svg width="20" height="20" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            Continue with Google
                        </button>
                        <button type="button" class="btn-social" onclick="loginWithApple()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                            </svg>
                            Continue with Apple
                        </button>
                    </div>

                    <!-- Sign Up Link -->
                    <div class="login-footer">
                        <p>Don't have an account? <a href="./signup.html" class="signup-link">Create Account</a></p>
                    </div>
                </form>
            </div>
        </div>

        <!-- Right Column: Background/Illustration -->
        <div class="login-image-section">
            <div class="login-image-content">
                <h2>Document Management</h2>
                <p>Secure access to create and manage documents efficiently</p>
                <div class="login-features">
                    <div class="feature-item">
                        <i class="fas fa-file-alt"></i>
                        <span>Document Creation</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-chart-line"></i>
                        <span>Analytics & Reports</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-cog"></i>
                        <span>System Management</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Social Login Functions
        function loginWithGoogle() {
            console.log('Initiating Google login...');
            // Add Google OAuth integration here
            alert('Google login integration - redirect to Google OAuth');
        }

        function loginWithApple() {
            console.log('Initiating Apple login...');
            // Add Apple Sign-In integration here
            alert('Apple login integration - redirect to Apple Sign-In');
        }

        // Password Toggle Functionality
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.classList.remove('fa-eye');
                passwordIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                passwordIcon.classList.remove('fa-eye-slash');
                passwordIcon.classList.add('fa-eye');
            }
        }

        // Form Input Focus Effects
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function () {
                this.parentElement.classList.add('focused');
            });

            input.addEventListener('blur', function () {
                if (!this.value) {
                    this.parentElement.classList.remove('focused');
                }
            });
        });
    </script>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1/dist/umd/supabase.min.js"></script>

    <!-- Keep existing Authentication System -->
    <script src="../js/config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
