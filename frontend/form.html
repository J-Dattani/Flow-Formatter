<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Form - Smart Document Merger</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="css/variables.css" rel="stylesheet">
    <link href="css/components/utilities.css" rel="stylesheet">
    
    <style>
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid #e9ecef;
        }
        
        .form-group {
            margin-bottom: 2rem;
        }
        
        .form-group label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #495057;
        }
        
        .form-group .form-text {
            color: #6c757d;
            font-size: 0.875rem;
        }
        
        .required-field::after {
            content: ' *';
            color: #dc3545;
        }
        
        .image-upload-area {
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            background: #f8f9fa;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .image-upload-area:hover {
            border-color: var(--primary-color);
            background: rgba(var(--primary-rgb), 0.05);
        }
        
        .image-upload-area.drag-over {
            border-color: var(--primary-color);
            background: rgba(var(--primary-rgb), 0.1);
        }
        
        .image-preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-top: 1rem;
        }
        
        .form-actions {
            position: sticky;
            bottom: 0;
            background: white;
            border-top: 1px solid #e9ecef;
            padding: 1.5rem 0;
            margin-top: 3rem;
        }
        
        .progress-indicator {
            margin-bottom: 2rem;
        }
        
        .preview-document {
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 3rem;
            margin: 2rem auto;
            max-width: 800px;
            font-family: 'Inter', sans-serif;
        }
        
        .preview-title {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .preview-subtitle {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 1.5rem 0 1rem 0;
        }
        
        .preview-paragraph {
            line-height: 1.6;
            margin-bottom: 1rem;
        }
        
        .preview-quote {
            font-style: italic;
            padding: 1rem;
            background: #f8f9fa;
            border-left: 4px solid var(--primary-color);
            margin: 1.5rem 0;
        }
        
        .preview-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 1.5rem auto;
            border-radius: 8px;
        }
        
        .preview-divider {
            border: none;
            height: 2px;
            background: #dee2e6;
            margin: 2rem 0;
        }
        
        .validation-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="form-container">
            <!-- Form Header -->
            <div class="form-header">
                <h1 class="fw-bold mb-3" id="templateTitle">Document Generator</h1>
                <p class="text-muted mb-0" id="templateDescription">Fill out the form below to generate your document</p>
            </div>

            <!-- Progress Indicator -->
            <div class="progress-indicator">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="small text-muted">Progress</span>
                    <span class="small text-muted" id="progressText">0% Complete</span>
                </div>
                <div class="progress">
                    <div class="progress-bar" role="progressbar" style="width: 0%" id="progressBar"></div>
                </div>
            </div>

            <!-- Dynamic Form -->
            <form id="documentForm" novalidate>
                <div id="formFields">
                    <!-- Dynamic form fields will be inserted here -->
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                    <div class="d-flex justify-content-between">
                        <div>
                            <button type="button" class="btn btn-outline-secondary" id="previewBtn">
                                <i class="fas fa-eye me-2"></i>Preview Document
                            </button>
                        </div>
                        <div>
                            <button type="button" class="btn btn-outline-primary me-2" id="saveProgressBtn">
                                <i class="fas fa-save me-2"></i>Save Progress
                            </button>
                            <button type="submit" class="btn btn-primary" id="generateBtn">
                                <i class="fas fa-file-export me-2"></i>Generate Document
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal fade" id="previewModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Document Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="documentPreview" class="preview-document">
                        <!-- Preview content will be generated here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="downloadPreviewBtn">
                        <i class="fas fa-download me-2"></i>Download PDF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-check-circle me-2"></i>Document Generated Successfully!
                    </h5>
                </div>
                <div class="modal-body">
                    <p>Your document has been generated with perfect formatting according to the template.</p>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-primary" id="downloadDocBtn">
                            <i class="fas fa-download me-2"></i>Download Document
                        </button>
                        <button type="button" class="btn btn-outline-primary" id="viewDocBtn">
                            <i class="fas fa-eye me-2"></i>View Document
                        </button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success" onclick="location.reload()">Create Another Document</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <!-- Supabase + API to load real templates -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js?v=20251010"></script>
    <script src="js/api.js?v=20251010"></script>
    <!-- Shared preview renderer for consistent preview/PDF -->
    <script src="js/preview-renderer.js?v=20251010"></script>
    <!-- html2pdf for PDF export from preview -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="js/form-generator.js?v=20251010"></script>
</body>
</html>
