<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authors Management - Smart Document Merger</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="../css/variables.css" rel="stylesheet">
    <link href="../css/components/dashboard.css" rel="stylesheet">
    <link href="../css/components/utilities.css" rel="stylesheet">
</head>
        
<body class="dashboard-container">
    <!-- Sidebar -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Header -->
        <div class="top-header">
            <div class="mt-3 mb-3 d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <button class="btn btn-link d-lg-none" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h4 class="mb-0 fw-bold">Authors Management</h4>
                </div>
                
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAuthorModal">
                        <i class="fas fa-plus me-2"></i>Add Author
                    </button>
                    
                    <!-- Profile Dropdown -->
                     <!-- User Profile -->
                    <div class="dropdown">
                        <button class="btn btn-link d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                            <span id="adminName"></span>
                            <div class="admin-avatar rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
                                A
                            </div>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#"><i class="fas fa-user me-2"></i>Profile</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-cog me-2"></i>Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="headerLogoutBtn"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Filters and Search -->
            <div class="row mb-4">
                <div class="col-md-8">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Search authors..." id="searchAuthors">
                    </div>
                </div>
                <div class="col-md-4">
                    <select class="form-select" id="statusFilter">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="pending">Pending</option>
                        <option value="blocked">Blocked</option>
                    </select>
                </div>
            </div>

            <!-- Authors Grid -->
            <div class="row" id="authorsGrid">
                <!-- Authors will be loaded here -->
            </div>

            <!-- Pagination -->
            <nav aria-label="Page navigation" class="mt-4">
                <ul class="pagination justify-content-center" id="pagination">
                    <!-- Pagination will be generated here -->
                </ul>
            </nav>
        </div>
    </div>

    <!-- Add Author Modal -->
    <div class="modal fade" id="addAuthorModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Author</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addAuthorForm">
                        <div class="mb-3">
                            <label for="authorName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="authorName" required>
                        </div>
                        <div class="mb-3">
                            <label for="authorEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="authorEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="authorRole" class="form-label">Role</label>
                            <select class="form-select" id="authorRole" required>
                                <option value="">Select Role</option>
                                <option value="content_writer">Content Writer</option>
                                <option value="editor">Editor</option>
                                <option value="reviewer">Reviewer</option>
                                <option value="contributor">Contributor</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="authorDepartment" class="form-label">Department</label>
                            <input type="text" class="form-control" id="authorDepartment">
                        </div>
                        <div class="mb-3">
                            <label for="authorBio" class="form-label">Bio (Optional)</label>
                            <textarea class="form-control" id="authorBio" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addAuthor()">Add Author</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Author Modal -->
    <div class="modal fade" id="editAuthorModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Author</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editAuthorForm">
                        <input type="hidden" id="editAuthorId">
                        <div class="mb-3">
                            <label for="editAuthorName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="editAuthorName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editAuthorEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="editAuthorEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="editAuthorRole" class="form-label">Role</label>
                            <select class="form-select" id="editAuthorRole" required>
                                <option value="content_writer">Content Writer</option>
                                <option value="editor">Editor</option>
                                <option value="reviewer">Reviewer</option>
                                <option value="contributor">Contributor</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editAuthorDepartment" class="form-label">Department</label>
                            <input type="text" class="form-control" id="editAuthorDepartment">
                        </div>
                        <div class="mb-3">
                            <label for="editAuthorStatus" class="form-label">Status</label>
                            <select class="form-select" id="editAuthorStatus">
                                <option value="active">Active</option>
                                <option value="pending">Pending</option>
                                <option value="blocked">Blocked</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editAuthorBio" class="form-label">Bio</label>
                            <textarea class="form-control" id="editAuthorBio" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateAuthor()">Update Author</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin-layout.js"></script>
    <script src="../js/authors.js"></script>
</body>
</html>
