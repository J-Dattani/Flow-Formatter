<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Smart Document Merger</title>
        <link rel="icon" type="image/x-icon" href="../assets/logo_white.ico">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="../css/variables.css" rel="stylesheet">
    <link href="../css/components/dashboard.css" rel="stylesheet">
    <link href="../css/components/utilities.css" rel="stylesheet">
</head>
<body class="dashboard-container">
    <!-- Sidebar -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Top Navigation -->
        <div class="mt-3 mb-3 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <h4 class="mb-0 fw-semibold text-gray-800">Project Management</h4>
            </div>
            
            <div class="d-flex align-items-center">
                
                 <!-- User Profile -->
                    <div class="dropdown">
                        <button class="btn btn-link d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                            <span id="adminName"></span>
                            <div class="admin-avatar rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
                                A
                            </div>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#"><i class="fas fa-user me-2"></i>Profile</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-cog me-2"></i>Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="headerLogoutBtn"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                        </ul>
                    </div>
            </div>
        </div>

        <!-- Projects Content -->
        <div class="container-fluid">
            <!-- Project Stats -->
            <div class="row mb-4">
                <div class="col-lg-3 col-md-6 mb-3">
                    <div class="stats-card">
                        <div class="d-flex align-items-center">
                            <div class="stats-icon primary me-3">
                                <i class="fas fa-folder"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold">18</h3>
                                <p class="mb-0 text-muted">Active Projects</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-lg-3 col-md-6 mb-3">
                    <div class="stats-card">
                        <div class="d-flex align-items-center">
                            <div class="stats-icon success me-3">
                                <i class="fas fa-check-circle"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold">42</h3>
                                <p class="mb-0 text-muted">Completed Projects</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-lg-3 col-md-6 mb-3">
                    <div class="stats-card">
                        <div class="d-flex align-items-center">
                            <div class="stats-icon warning me-3">
                                <i class="fas fa-clock"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold">7</h3>
                                <p class="mb-0 text-muted">Pending Review</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-lg-3 col-md-6 mb-3">
                    <div class="stats-card">
                        <div class="d-flex align-items-center">
                            <div class="stats-icon info me-3">
                                <i class="fas fa-calendar"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold">3</h3>
                                <p class="mb-0 text-muted">Due This Week</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Projects Table -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-semibold">All Projects</h5>
                        <div class="d-flex align-items-center">
                            <div class="me-3">
                                <input type="text" class="form-control" placeholder="Search projects..." id="projectSearch">
                            </div>
                            <div class="dropdown">
                                <button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                                    Filter by Status
                                </button>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" href="#" data-filter="all">All Status</a></li>
                                    <li><a class="dropdown-item" href="#" data-filter="active">Active</a></li>
                                    <li><a class="dropdown-item" href="#" data-filter="review">In Review</a></li>
                                    <li><a class="dropdown-item" href="#" data-filter="completed">Completed</a></li>
                                    <li><a class="dropdown-item" href="#" data-filter="archived">Archived</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Project Name</th>
                                    <th>Template</th>
                                    <th>Authors</th>
                                    <th>Progress</th>
                                    <th>Status</th>
                                    <!-- Due Date column removed -->
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- tbody is intentionally empty — rows will be rendered dynamically from templates table -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin-layout.js"></script>
    <script src="../js/projects.js"></script>
</body>
</html>
