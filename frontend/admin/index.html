<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Smart Document Merger</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="../css/variables.css" rel="stylesheet">
    <link href="../css/components/login.css" rel="stylesheet">
</head>
<body class="login-container d-flex align-items-center justify-content-center">
    <div class="floating-elements">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <!-- Login Form Component will be loaded here -->
                <div class="card login-card border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="brand-logo">
                                <i class="fas fa-file-contract text-white" style="font-size: 32px;"></i>
                            </div>
                            <h2 class="mt-4 fw-bold text-gray-800">Welcome Back</h2>
                            <p class="text-muted">Smart Document Merger Admin Portal</p>
                        </div>
                        
                        <form id="loginForm">
                            <div class="mb-4">
                                <label class="form-label fw-semibold text-gray-700">Email Address</label>
                                <input type="email" id="email" class="form-control login-form-control" placeholder="admin@example.com" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-semibold text-gray-700">Password</label>
                                <input type="password" id="password" class="form-control login-form-control" placeholder="••••••••" required>
                            </div>
                            
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label text-gray-600" for="rememberMe">Keep me signed in</label>
                            </div>
                            
                            <button type="submit" class="btn btn-primary login-btn w-100 fw-semibold">
                                <i class="fas fa-sign-in-alt me-2"></i> Sign In
                            </button>
                            
                            <div id="errorMessage" class="alert alert-danger mt-3 d-none border-0"></div>
                        </form>

                        <div class="text-center mt-4">
                            <small class="text-muted">Secure admin access to document management</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <!-- [ADDED]: Step Auth - Supabase client (CDN + initializer). UI unchanged. -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
